<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillmatch 2.0 - jobs vs appliers matching analysis system</title>
    <meta name="description" content="sistema para análise de compatibilidade entre perfil de candidato e vagas ofertadas"/>
    <link rel="stylesheet" href="./assets/styles/index.style.css">
</head>
<body>
    <header class="cabeçalho">
        <img src="#" alt="logotipo">
        <h1>skillmatch web</h1>
    </header>

    <nav aria-label="navegação principal">

    </nav>

    <main class="container principal">
    
        <section id="perfil" aria-labelledby="titulo-perfil">
            <h2 id="titulo-perfil">Seu perfil profissional</h2>
    
            <form action="#" method="post" id="form-perfil" role="search">
    
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="seu nome aqui" required>

                    <label for="sobrenome">Sobrenome:</label>
                    <input type="text" id="sobrenome" name="sobrenome" placeholder="seu sobrenome aqui" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="seu email aqui" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="seu telefone de contato" required>

                </fieldset>

                <fieldset>
                    <legend>Experiência & Skills</legend>

                    <label for="expe">Experiência (em meses)</label>
                    <input type="number" id="expe" name="experiência">

                    <label for="area">Área:</label>
                    <select id="area" name="área">
                        <option value="">- selecione sua área</option>
                        <option value="front-end">Front End</option>
                        <option value="back-end">Back End</option>
                        <option value="database">Banco de Dados</option>
                        <option value="infra-devops">Infraestrutura / DevOps</option>
                        <option value="mobile">Mobile</option>
                        <option value="data">Dados | Engenharia, Ciência & Análise</option>
                        <option value="ia-ml">IA & Machine Learning</option>
                        <option value="cybersecurt">Cibersegurança</option>

                    <input type="checkbox" id="html" class="techs-fe" name="html" value="sim" />
                    <label for="html">HTML5</label>

                    <input type="checkbox" id="css" class="techs-fe" name="css" value="sim" />
                    <label for="css">CSS3</label>

                    <input type="checkbox" id="logica" class="techs-fe" name="logica" value="sim" />
                    <label for="logica">Lógica de programação</label>

                    <input type="checkbox" id="js" class="techs-fe" name="js" value="sim" />
                    <label for="js">JavaScript</label>                    

                    <input type="checkbox" id="kanban" class="techs-fe" name="kanban" value="sim" />
                    <label for="kanban">método Kanban</label>

                    <input type="checkbox" id="node" class="techs-fe" name="node" value="sim" />
                    <label for="node">Node.js</label>

                    <input type="checkbox" id="git" class="techs-fe" name="git" value="sim" />
                    <label for="git">GitHub & versionamento</label>

                    <input type="checkbox" id="ts" class="techs-fe" name="ts" value="sim" />
                    <label for="ts">TypeScript</label>

                    <input type="checkbox" id="react" class="techs-fe" name="react" value="sim" />
                    <label for="react">React</label>

                    <input type="checkbox" id="vue" class="techs-fe" name="vue" value="sim" />
                    <label for="vue">Vue.js</label>

                    <input type="checkbox" id="angular" class="techs-fe" name="angular" value="sim" />
                    <label for="angular">Angular</label>

                    <input type="checkbox" id="svelte" class="techs-fe" name="svelte" value="sim" />
                    <label for="svelte">Svelte</label>

                    <input type="checkbox" id="nextjs" class="techs-fe" name="nextjs" value="sim" />
                    <label for="nextjs">Next.js</label>

                    <input type="checkbox" id="nuxt" class="techs-fe" name="nuxt" value="sim" />
                    <label for="nuxt">Nuxt</label>

                    <input type="checkbox" id="sveltekit" class="techs-fe" name="sveltekit" value="sim" />
                    <label for="sveltekit">SvelteKit</label>

                    <input type="checkbox" id="astro" class="techs-fe" name="astro" value="sim" />
                    <label for="astro">Astro</label>

                    <input type="checkbox" id="tailwindcss" class="techs-fe" name="tailwindcss" value="sim" />
                    <label for="tailwindcss">Tailwind CSS</label>

                    <input type="checkbox" id="bootstrap" class="techs-fe" name="bootstrap" value="sim" />
                    <label for="bootstrap">Bootstrap</label>

                    <input type="checkbox" id="sass" class="techs-fe" name="sass" value="sim" />
                    <label for="sass">SaSS (SCSS)</label>
                    












                    <label for="sobrenome">Sobrenome:</label>
                    <input type="text" id="sobrenome" name="sobrenome">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone">
                    
                </fieldset>
                
                <div>

                </div>

                <button type="submit">

                </button>
    
            </form>
    
        </section>

        <section id='resultados' aria-labelledby="titulo-resultados>
            <h2 id="titulo-resultados">Resultados de compatibilidade</h2>
            <div>

                <div>

                    <article>
                        <h3 id="vaga01" class="cards-vagas">oferta01</h3>
                    </article>

                    <article>
                        <h3 id="vaga01" class="cards-vagas">oferta01</h3>
                    </article>

                </div>


            </div>


        </section>
    
    </main>

    <footer class="rodapé">

    </footer>

    <script type="module" src="./assets/scripts/main.js"></script>
</body>
</html>
